name: Check jobs

# Does all the OnlineJobs.ph checking (the PC only sends a heartbeat).
# Alerts go to the PC topic if the PC heartbeat is fresh, otherwise to the phone.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: olj-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      PC_TOPIC: ${{ secrets.PC_TOPIC }}
      HEARTBEAT_TOPIC: ${{ secrets.HEARTBEAT_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run checker (cloud mode)
        run: node checker.mjs --cloud
