name: Keepalive

# GitHub turns off scheduled workflows in public repos after 60 days without
# repository activity. This makes one small commit a month so that never happens.
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit a timestamp
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .keepalive
          git commit -m "Monthly keepalive" || echo "nothing to commit"
          git push
